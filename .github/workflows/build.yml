name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Java Development Kit 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: maven-settings-xml-action
        uses: whelk-io/maven-settings-xml-action@v20
        with:
          repositories: >
            [
              {
                "id": "celest-api",
                "url": "https://maven.pkg.github.com/ProjetCeleste/celest-api"
              },
              {
                "id": "celest-dependencies",
                "url": "https://maven.pkg.github.com/ProjetCeleste/celest-dependencies"
              }
            ]
          servers: >
            [
              {
                "id": "celest-api",
                "username": "${{ secrets.CELEST_USER }}",
                "password": "${{ secrets.CELEST_TOKEN }}"
              },
              {
                "id": "celest-dependencies",
                "username": "${{ secrets.CELEST_USER }}",
                "password": "${{ secrets.CELEST_TOKEN }}"
              }
            ]

      - name: Build project with Maven
        run: mvn -B package

      - name: Deploy to servers
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADDRESS: ${{ secrets.ADDRESS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no target/CelestWizzard.jar $ADDRESS
